<mat-toolbar color="primary">
  <button mat-icon-button (click)="cancel()" aria-label="Volver">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Nueva tarea</span>
</mat-toolbar>

<div class="new-task-page">
  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="task-form">
        <mat-form-field appearance="outline">
          <mat-label>Título</mat-label>
          <input matInput formControlName="title" placeholder="Ej. Entregar informe mensual" />
          @if (form.controls.title.hasError('required') && form.controls.title.touched) {
            <mat-error>El título es obligatorio</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Prioridad</mat-label>
          <mat-select formControlName="priorityLevel">
            @for (priority of priorities; track priority.value) {
              <mat-option [value]="priority.value">{{ priority.label }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Notas (opcional)</mat-label>
          <textarea matInput formControlName="notes" rows="4"></textarea>
        </mat-form-field>

        @if (errorMessage()) {
          <div class="form-message error">{{ errorMessage() }}</div>
        }

        <div class="form-actions">
          <button mat-button type="button" (click)="cancel()">Cancelar</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="loading()">
            @if (loading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Guardar tarea
            }
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
